name: Auto Update YuppTV M3U Playlist

on:
  schedule:
    # Runs automatically every 50 minutes
    - cron: '*/50 * * * *'
  workflow_dispatch: # Manual run button in GitHub Actions tab

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: |
          python scraper.py

      - name: Commit and Push Updated M3U Playlist
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add yupptv_playlist.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update YuppTV M3U playlist [skip ci]" && git push)
